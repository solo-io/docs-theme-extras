# resolves a name present here to an inline SVG (via Hextra's utils/icon.html),
# the same lookup consumers use for branded icons (e.g. ambientmesh's solo /
# waypoint logos). A single currentColor path so it inherits the callout's
# per-type color; `data-testicon` gives the spec a stable hook.
flask: |

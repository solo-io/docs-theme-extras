# Configuration for the harness when run against the bundled fixture
# (`make self-test`). The Makefile sets DOCS_TEST_CONFIG to this file's
# absolute path; all relative paths below resolve against this file's
# directory (fixture/).

version = "1"
name    = "docs-theme-extras-fixture-oss"

# Which brand layer the build under test was produced with. tests/brand.spec.ts
# uses this to assert the right brand CSS / font / logo loaded for the build.
# Must match the value of params.themeExtras.brand in hugo-oss.toml.
brand   = "oss"

# Brand-OSS variant: hugo-oss.toml builds into ../public-oss, with the same
# baseURL "/test" so the page-list URLs stay aligned with the bare build.
builtRoot = "../public-oss"
baseURL   = "/test"

# Hugo build log captured by `make build-oss` (2> .build-oss.log).
buildLog  = "../.build-oss.log"

# Source-tree roots for author-side lints (curl-quotes). The fixture is the
# only source the module ships, so scope stays tight.
scanRoots = [
  "./content/en/test",
  "./assets/conrefs/test",
]

# Builds this source corpus is rendered under, for the gateAxisCollision lint
# (tests/gate-axis-collision.spec.ts). The fixture is siteParams mode with
# buildCondition = "test" and three registered sections, which is the shape
# where the two gating axes come apart and an either/or pair can double-fire.
#
# The fixture corpus itself must stay CLEAN — the detector is proven by the
# helper unit tests in that spec, which use agentgateway's real shape, and the
# corpus scan proves the walk runs and finds nothing. A permanent violation
# here would just be a permanently red test.
[[gateAxes]]
name      = "fixture"
condition = "test"
sections  = ["demo", "alt", "nested"]

# Explicit page list (mirrors solo-io/docs's TEST_PAGES). Specs that walk
# the whole tree use crawl.ts; this list gates the per-page sample specs.
[[pages]]
url = "/test/"

[[pages]]
url = "/test/v2/everything/"

[[pages]]
url = "/test/v2/rebased/"

[[pages]]
url = "/test/v1/everything/"

[[pages]]
url = "/test/v1/rebased/"

[[pages]]
url = "/test/main/everything/"

[[pages]]
url = "/test/main/rebased/"

# NOTE: the trailing-step fixture pages (test/{v1,v2,main}/trailing-step) are
# deliberately NOT listed here. static.spec.ts treats every non-landing
# [[pages]] entry as a comprehensive "all shortcode markers present" topic
# page; trailing-step is a focused regression page and would fail that. The
# version-nested-list spec resolves those pages by direct path instead
# (gated on IS_FIXTURE_TARGET), the same pattern conditional-block / version-
# cards use for fixture-only pages.

# Version segment is /v1/, /v2/, or /main/ at the start of the URL (after
# baseURL is stripped by target.versionOf).
[versioning]
versionFromPath = "^/(?<version>v\\d+|main)/"
versions        = ["v1", "v2", "main"]

# Allowlists: known-benign Hugo deprecation noise from hextra 0.12.2.
[allowlists]
# The "unknown mode" warn is emitted on purpose by the table-display fixture
# page to exercise the `table` shortcode's invalid-mode fallback path.
# The last two are DELIBERATE relatedDocs config-error probes, present only in
# hugo-oss.toml (an empty group, and a version with no `label` key), so the
# enterprise fixture build stays warning-clean and would fail if either
# warning started firing there. See tests/related-docs.spec.ts.
hugoWarnings = [
  "\\.Site\\.Data was deprecated",
  "table shortcode: unknown mode",
  "params\\.relatedDocs group \"Empty fixture product\" has no `versions`",
  "params\\.relatedDocs group \"Sibling fixture product\" has a version with no `label` key",
  # `demo` and `alt` are registered sections that deliberately do NOT nest their
  # version trees, pinning the "registered without nesting" fallback in
  # utils/resolve-sections.html. No production consumer uses that shape, so the
  # theme warns on it rather than special-casing its own fixture — see
  # tests/section-nested-versions.spec.ts and the warning block in that partial.
  "params\\.sections \\[alt demo\\] are registered but nest no version tree",
]

# UI strings for this module's own templates. Consumers override any key in
# their own i18n/<lang>.yaml. Templates also pass an English `default`, so a
# language with no file here still renders something.

# Accessible names for the navigation landmarks: a screen reader announces
# "Main navigation" and "Docs navigation" in its landmark list.
mainNavigation: Main
docsNavigation: Docs

# Doc-test badge (components/test-status-badge.html): the badge label, and the
# explanation shown in its tooltip and read by screen readers.
testStatusVerified: Verified
testStatusVerifiedTooltip: Code examples on this page have been automatically tested and verified.
# When the page lists the kinds of test that ran (`test_types`), the tooltip
# shows this intro and one label plus description per kind instead.
testStatusTypesIntro: "The code examples on this page passed these automated tests:"
testTypeKubernetes: Kubernetes resources
testTypeKubernetesDescription: The Kubernetes resources on this page were checked against their API schemas.
testTypeConfig: Configuration files
testTypeConfigDescription: The configuration files on this page were checked against their schema.
testTypeSchema: Code examples
testTypeSchemaDescription: The code examples on this page were checked against their schemas.
testTypeHelm: Helm values
testTypeHelmDescription: The Helm values on this page were checked against the values the chart accepts.
testTypeFunctional: End-to-end run
testTypeFunctionalDescription: Every step ran in a fresh test environment and the results were checked.
testTypeLive: Live services
testTypeLiveDescription: Requests went to a real external endpoint.
testTypeCredentialed: Real provider account
testTypeCredentialedDescription: The steps ran against the real provider with a test account.

# Local-dev variant of hugo-enterprise.toml. Used by
# `make server-enterprise`. baseURL is "/" instead of "/test" so
# `hugo server` mounts the home page at http://localhost:1313/ rather than
# the malformed http://localhost:1313//test/ that path-only baseURLs
# produce in dev mode. Production-shaped URL prefixes (folder, productPath,
# version urls) are stripped to match the bare-rooted layout.
baseURL = "/"
languageCode = "en-us"
title = "Docs framework test fixture (enterprise brand)"
linkTitle = "Test"
contentDir = "fixture/content/en/test"
publishDir = "public-enterprise-local"
enableInlineShortcodes = true

[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"
    disable = false

  # Surface fixture/assets and fixture/static into Hugo's standard locations
  # for the self-test build. The fixture stays under fixture/ so it isn't
  # exposed to consumers that import this module via go.mod — they only see
  # top-level layouts/.
  [[module.mounts]]
    source = "layouts"
    target = "layouts"

  # Fixture's consumer-side layout overrides — see hugo-oss.toml comment.
  [[module.mounts]]
    source = "fixture/layouts"
    target = "layouts"

  # Module's own CSS/JS overlay (custom.css drives version-dropdown,
  # copy-md-btn, and other docs-specific component styling that Hextra's
  # head partial auto-picks-up via resources.Get "css/custom.css").
  [[module.mounts]]
    source = "assets"
    target = "assets"

  [[module.mounts]]
    source = "fixture/assets"
    target = "assets"

  [[module.mounts]]
    source = "fixture/static"
    target = "static"

  # Content mounts (local dev only). The shared fixture tree plus the
  # tab-navigation demo tree (fixture/tabs-demo/v3, issue solo-io/docs#3164).
  # Mounting v3 here — instead of leaving it under contentDir — keeps it out
  # of the test build (hugo-enterprise.toml uses only contentDir), so the
  # pager / version specs never see a v3 sibling. Declaring an explicit
  # content mount overrides the contentDir default, so the base tree is
  # re-mounted too.
  [[module.mounts]]
    source = "fixture/content/en/test"
    target = "content"
  [[module.mounts]]
    source = "fixture/tabs-demo/v3"
    target = "content/v3"

[build]
  writeStats = true
  [[build.cachebusters]]
    source = "assets/watching/hugo_stats\\.json"
    target = "styles\\.css"
  [[build.cachebusters]]
    source = "(postcss|tailwind)\\.config\\.js"
    target = "css"
  [[build.cachebusters]]
    source = "assets/.*\\.(js|ts|jsx|tsx)"
    target = "js"
  [[build.cachebusters]]
    source = "assets/.*\\.(.*)$"
    target = "$1"

[params]

product = "Docs framework test fixture"
productPath = "/"
buildCondition = "test"
currentProduct = "test"
pathName = "/docs"
version = "latest"
defaultVersion = "v2"
folder = ""
versionBanner = false
versionBannerText = ""
versionSpecificBanner = true

# This module's page-context partial dispatches on this flag. The fixture was
# authored against the docs convention (Site.Params.folder / currentProduct).
# Other consumers that follow the /docs/<section>/<version>/... URL shape can
# either omit this param (default is "url") or set it to "url" explicitly.
pageContextMode = "siteParams"

# Brand layer selector for head-end.html. Loads brand-enterprise.css.
[params.themeExtras]
  brand = "enterprise"

[params.footer]
  copyright = "Solo.io copyright 2026"
  displayPoweredBy = false

  # Enterprise puts the product lockup in the navbar (see params.navbar.logo),
  # so the Solo corporate mark moves to the footer.
  [params.footer.logo]
    path = "images/logos/solo-light.svg"
    dark = "images/logos/solo-dark.svg"

[params.docs]
  title = "Docs framework test fixture"
  toc = true

[params.navbar]
  displayTitle = false
  displayLogo = true
  width = "wide"

  # Product lockup in the navbar (enterprise). The Solo corporate mark now
  # lives in the footer (see params.footer.logo). With no sidebar.logo set, the
  # product logo is also the mobile navbar mark and the sidebar product-logo
  # band no longer renders — so the tab band sits directly above the left nav.
  [params.navbar.logo]
    path = "images/logos/logo-sef-test.svg"
    dark = "images/logos/logo-sef-test-dark.svg"
    width = 238
    height = 63

[params.page]
  width = "wide"

[params.theme]
  default = "system"
  displayToggle = false

[params.search]
  enable = true
  type = "flexsearch"

  [params.search.flexsearch]
    index = "content"

[params.editURL]
  enable = false

[[params.versions]]
  version = "v2"
  dropdown = "v2 (current)"
  linkVersion = "v2"
  url = "/v2"
  product = "test"
  productName = "Docs framework test fixture"

[[params.versions]]
  version = "v1"
  dropdown = "v1"
  linkVersion = "v1"
  url = "/v1"
  product = "test"
  productName = "Docs framework test fixture"

[[params.versions]]
  version = "main"
  dropdown = "main (dev)"
  linkVersion = "main"
  url = "/main"
  banner = "This version of the documentation is currently under development. See the [v2 docs](/test/v2/) or the [upstream project](https://github.com/solo-io/docs)."
  product = "test"
  productName = "Docs framework test fixture"

# v3 is the tab-navigation demo version (issue solo-io/docs#3164). It is also
# declared (and mounted) in hugo-oss.toml / hugo-enterprise.toml so the CI test
# build exercises the id-based tab band; kept here too so `make server-oss` /
# `server-enterprise` render it for local preview.
[[params.versions]]
  version = "v3"
  dropdown = "v3 (tabs demo)"
  linkVersion = "v3"
  url = "/v3"
  product = "test"
  productName = "Docs framework test fixture"

# ── Tab navigation (PROTOTYPE — issue solo-io/docs#3164) ──────────────────
# Declares the tab bar rendered by layouts/_partials/docs-tabs.html. The list
# is ordered; `default = true` marks the tab that's active on pages above every
# tab directory (e.g. the version-root landing).
#
# Directory model: each tab's `id` names a top-level content directory under the
# version root; every page in that directory is the tab, and the left nav is
# rooted INSIDE the directory, so the directory's own node never appears (this
# is what removes the "tab name shown twice" duplication). The tabs-demo v3 tree
# is partitioned this way — documentation/, api/, changelog/. A version with
# fewer than 2 tab directories renders no band (v1/v2/main here), which is the
# "without tabs" view.
[[params.docTabs]]
  name = "Documentation"
  id = "documentation"
  default = true

[[params.docTabs]]
  name = "API Reference"
  id = "api"

[[params.docTabs]]
  name = "Changelog"
  id = "changelog"

# Section-keyed versions used by tests/version-cards.spec.ts — kept in
# sync with hugo-enterprise.toml so `make server-enterprise` matches the
# test build.
[[params.sections.demo.versions]]
  version = "v2"
  dropdown = "demo override: v2 only"
  linkVersion = "v2"

[[params.sections.demo.versions]]
  version = "v1"
  dropdown = "demo override: v1 only"
  linkVersion = "v1"

[[menu.main]]
  name = "Search"
  weight = 1
  [menu.main.params]
    type = "search"

[[menu.main]]
  name = "Theme"
  weight = 5
  [menu.main.params]
    type = "theme-toggle"
    label = false

[[menu.main]]
  name = "GitHub"
  weight = 3
  url = "https://github.com/solo-io"
  [menu.main.params]
    icon = "github"

[outputs]
  home = ["HTML", "RSS", "llms"]
  page = ["HTML", "markdown"]
  section = ["HTML", "RSS", "markdown"]

[markup]

[markup.tableOfContents]
  endLevel = 6
  startLevel = 1

[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.parser]
  attribute = true

[markup.goldmark.extensions.extras.superscript]
  enable = true

[markup.highlight]
  noClasses = false

[sitemap]
  changeFreq = ''
  filename = 'sitemap.xml'
  priority = -1

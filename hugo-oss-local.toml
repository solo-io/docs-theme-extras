# Local-dev variant of hugo-oss.toml. Used by `make server-oss`. baseURL is
# "/" instead of "/test" so `hugo server` mounts the home page at
# http://localhost:1313/ rather than the malformed
# http://localhost:1313//test/ that path-only baseURLs produce in dev mode.
# Production-shaped URL prefixes (folder, productPath, version urls) are
# stripped to match the bare-rooted layout.
baseURL = "/"
languageCode = "en-us"
title = "Docs framework test fixture (OSS brand)"
linkTitle = "Test"
contentDir = "fixture/content/en/test"
publishDir = "public-oss-local"
enableInlineShortcodes = true

[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"
    disable = false

  # Surface fixture/assets and fixture/static into Hugo's standard locations
  # for the self-test build. The fixture stays under fixture/ so it isn't
  # exposed to consumers that import this module via go.mod — they only see
  # top-level layouts/.
  [[module.mounts]]
    source = "layouts"
    target = "layouts"

  # Fixture's consumer-side layout overrides — see hugo-oss.toml comment.
  [[module.mounts]]
    source = "fixture/layouts"
    target = "layouts"

  # Module's own CSS/JS overlay (custom.css drives version-dropdown,
  # copy-md-btn, and other docs-specific component styling that Hextra's
  # head partial auto-picks-up via resources.Get "css/custom.css").
  [[module.mounts]]
    source = "assets"
    target = "assets"

  [[module.mounts]]
    source = "fixture/assets"
    target = "assets"

  [[module.mounts]]
    source = "fixture/static"
    target = "static"

  # Content mounts (local dev only). The shared fixture tree plus the
  # tab-navigation demo tree (fixture/tabs-demo/v3, issue solo-io/docs#3164).
  # Mounting v3 here — instead of leaving it under contentDir — keeps it out
  # of the test build (hugo-oss.toml uses only contentDir), so the pager /
  # version specs never see a v3 sibling. Declaring an explicit content mount
  # overrides the contentDir default, so the base tree is re-mounted too.
  [[module.mounts]]
    source = "fixture/content/en/test"
    target = "content"
  [[module.mounts]]
    source = "fixture/tabs-demo/v3"
    target = "content/v3"

[build]
  writeStats = true
  [[build.cachebusters]]
    source = "assets/watching/hugo_stats\\.json"
    target = "styles\\.css"
  [[build.cachebusters]]
    source = "(postcss|tailwind)\\.config\\.js"
    target = "css"
  [[build.cachebusters]]
    source = "assets/.*\\.(js|ts|jsx|tsx)"
    target = "js"
  [[build.cachebusters]]
    source = "assets/.*\\.(.*)$"
    target = "$1"

[params]

product = "Docs framework test fixture"
productPath = "/"
buildCondition = "test"
currentProduct = "test"
pathName = "/docs"
version = "latest"
defaultVersion = "v2"
folder = ""
versionBanner = false
versionBannerText = ""
versionSpecificBanner = true

# This module's page-context partial dispatches on this flag. The fixture was
# authored against the docs convention (Site.Params.folder / currentProduct).
# Other consumers that follow the /docs/<section>/<version>/... URL shape can
# either omit this param (default is "url") or set it to "url" explicitly.
pageContextMode = "siteParams"

# Brand layer selector for head-end.html. Loads brand-oss.css.
[params.themeExtras]
  brand = "oss"

[params.footer]
  copyright = "Solo.io copyright 2026"
  displayPoweredBy = false

[params.docs]
  title = "Docs framework test fixture"
  toc = true

[params.navbar]
  displayTitle = false
  displayLogo = true
  width = "wide"

  # OSS navbar shows the product logo, not Solo's company mark. SVG aspect
  # ratio is ~3.79:1 (viewBox 2708×714), so width=152 / height=40 preserves
  # proportions without stretching.
  [params.navbar.logo]
    path = "images/logos/logo-oss-test.svg"
    dark = "images/logos/logo-oss-test-dark.svg"
    width = 152
    height = 40

# OSS leaves the sidebar product logo unset on purpose — the navbar already
# displays the product logo, so the sidebar slot would be a redundant
# duplicate. Hextra's sidebar partial skips the logo block entirely when
# Site.Params.sidebar.logo is unset.

[params.page]
  width = "wide"

[params.theme]
  default = "system"
  displayToggle = false

[params.search]
  enable = true
  type = "flexsearch"

  [params.search.flexsearch]
    index = "content"

[params.editURL]
  enable = false

[[params.versions]]
  version = "v2"
  dropdown = "v2 (current)"
  linkVersion = "v2"
  url = "/v2"
  product = "test"
  productName = "Docs framework test fixture"

[[params.versions]]
  version = "v1"
  dropdown = "v1"
  linkVersion = "v1"
  url = "/v1"
  product = "test"
  productName = "Docs framework test fixture"

[[params.versions]]
  version = "main"
  dropdown = "main (dev)"
  linkVersion = "main"
  url = "/main"
  banner = "This version of the documentation is currently under development. "
  product = "test"
  productName = "Docs framework test fixture"

# v3 is the tab-navigation demo version (issue solo-io/docs#3164). It is added
# to the LOCAL dev configs only (not hugo-oss.toml / hugo-enterprise.toml), so
# `make server-oss` / `server-enterprise` show the tabbed nav while the test
# build stays byte-for-byte unaffected.
[[params.versions]]
  version = "v3"
  dropdown = "v3 (tabs demo)"
  linkVersion = "v3"
  url = "/v3"
  product = "test"
  productName = "Docs framework test fixture"

# ── Tab navigation (PROTOTYPE — issue solo-io/docs#3164) ──────────────────
# Declares the tab bar rendered by layouts/_partials/docs-tabs.html. The list
# is ordered; `default = true` marks the tab that top-level sections fall into
# when they carry no `tab` front matter. A version with fewer than 2 non-empty
# tabs renders no band (v1/v2/main here), which is the "without tabs" view.
[[params.docTabs]]
  name = "Documentation"
  default = true

[[params.docTabs]]
  name = "API Reference"

[[params.docTabs]]
  name = "Reference"

[[params.docTabs]]
  name = "Changelog"

# Section-keyed versions used by tests/version-cards.spec.ts — kept in
# sync with hugo-oss.toml so `make server-oss` matches the test build.
[[params.sections.demo.versions]]
  version = "v2"
  dropdown = "demo override: v2 only"
  linkVersion = "v2"

[[params.sections.demo.versions]]
  version = "v1"
  dropdown = "demo override: v1 only"
  linkVersion = "v1"

[[menu.main]]
  name = "Search"
  weight = 1
  [menu.main.params]
    type = "search"

[[menu.main]]
  name = "Theme"
  weight = 5
  [menu.main.params]
    type = "theme-toggle"
    label = false

[[menu.main]]
  name = "GitHub"
  weight = 3
  url = "https://github.com/solo-io"
  [menu.main.params]
    icon = "github"

[outputs]
  home = ["HTML", "RSS", "llms"]
  page = ["HTML", "markdown"]
  section = ["HTML", "RSS", "markdown"]

[markup]

[markup.tableOfContents]
  endLevel = 6
  startLevel = 1

[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.parser]
  attribute = true

[markup.goldmark.extensions.extras.superscript]
  enable = true

[markup.highlight]
  noClasses = false

[sitemap]
  changeFreq = ''
  filename = 'sitemap.xml'
  priority = -1

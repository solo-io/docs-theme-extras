# Dependabot keeps three pin surfaces fresh: GitHub Actions in workflows,
# npm packages (test harness), and Go modules (hextra + transitive).
# Updates land as PRs you can review and merge — they never gate CI.
#
# Grouping is intentional: actions and npm release frequently. Without
# groups, you'd get one PR per patch bump and lose interest fast.
version: 2
updates:
  # Workflow actions: actions/checkout, setup-node, peaceiris/actions-hugo,
  # cache, upload-artifact, etc.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  # Test harness deps (@playwright/test, parse5, serve, smol-toml).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    # Major version bumps (e.g., Playwright v2) get their own PR so the
    # release-notes review happens before the merge.
    #
    # The six ignores below are NOT preferences — they are the devDependencies
    # of `packages/hugoautogen/package.json`, which is GENERATED by
    # `hugo mod npm pack` from the Hugo module graph. Their versions come from
    # hextra's own package.json, so this repo cannot hold a bump: edit the file
    # and the next `hugo mod npm pack` writes the upstream value straight back.
    # `hugo_packagemeta.json` records the provenance — every one of them lists
    # `github.com/imfing/hextra` as its dependencySource.
    #
    # Without these, Dependabot sees the file through the root npm workspace and
    # opens PRs against it anyway. That already happened: #51 bumped postcss-cli
    # to 12.0.0, merged, and was silently undone when a regeneration on the #50
    # branch restored ^11.0.1 before #50 merged. A merged PR with no effect is
    # worse than no PR — it reads as a completed bump.
    #
    # To actually move one of these, bump hextra (the gomod entry below) and
    # rerun `hugo mod npm pack`. `@playwright/test` is deliberately absent from
    # this list: hextra declares it too, but the ROOT package.json declares it
    # as well, so it stays ours to bump and the generated file never carries it.
    ignore:
      - dependency-name: "@axe-core/playwright"
      - dependency-name: "@tailwindcss/postcss"
      - dependency-name: "postcss-cli"
      - dependency-name: "prettier"
      - dependency-name: "prettier-plugin-go-template"
      - dependency-name: "tailwindcss"

  # Hugo modules: hextra and anything pulled transitively. Bumping these
  # affects rendering across all consumer repos that pin to this module's
  # main branch, so each PR runs the full harness in CI before merging.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly

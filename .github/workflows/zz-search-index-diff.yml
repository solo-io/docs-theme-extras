# TEMPORARY experiment, not for merge. Finds out why the production search
# index hashes differently in two CI builds of the same fixture content
# (see the mask in tests/change-highlights.spec.ts).
#
# Builds the OSS fixture three times, the way `make test-oss` does on CI:
#   a1, a2  plain production builds (hugo-oss.toml), run back to back
#   b       the change-highlights production build (build-changes)
# then diffs the three search indexes. a1 vs a2 shows run-to-run variation;
# a1 vs b shows what the change-highlights switch adds.
name: Search index diff (experiment)

on:
  push:
    branches: [kkb-search-index-diff]

permissions:
  contents: read

env:
  HUGO_VERSION: 0.160.1
  NODE_VERSION: '20'

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Set up Go (Hugo modules use go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.21'

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci || npm install

      # Round 1 (a1/a2/b in isolation) showed identical indexes. Round 2: the
      # exact build sequence `make test-oss` runs on CI, then compare the two
      # builds the change-highlights test compares.
      - name: Build like make test-oss
        run: HUGO=hugo make build-oss build-devpath build-flat build-nosections build-section-title build-section-current build-nobook build-prodhost build-sitemap-i18n build-changes

      - name: Diff public-oss vs public-oss-changes search files
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          for d in public-oss public-oss-changes; do
            echo "$d: $(ls $d/test | grep -E 'search' | tr '\n' ' ')"
            cp $d/test/en.search-data.min.*.json "$out/$d.index.json"
            cp $d/test/en.search.min.*.js "$out/$d.bundle.js"
            tr ',;' '\n\n' < $d/test/en.search.min.*.js > "$out/$d.bundle.split.js"
            jq -S . $d/test/en.search-data.min.*.json > "$out/$d.index.pretty.json"
          done
          echo "::group::index"; cmp -s "$out/public-oss.index.pretty.json" "$out/public-oss-changes.index.pretty.json" && echo IDENTICAL || diff -u "$out/public-oss.index.pretty.json" "$out/public-oss-changes.index.pretty.json" | head -150; echo "::endgroup::"
          echo "::group::bundle"; cmp -s "$out/public-oss.bundle.js" "$out/public-oss-changes.bundle.js" && echo IDENTICAL || diff -u "$out/public-oss.bundle.split.js" "$out/public-oss-changes.bundle.split.js" | head -150; echo "::endgroup::"
          # Which page does each build's HTML point at, and are the logs clean?
          grep -ho 'en.search.min.[0-9a-f]*' public-oss/test/v2/everything/index.html public-oss-changes/test/v2/everything/index.html
          tail -5 .build-oss.log .build-oss-changes.log || true

      - name: Upload indexes and diffs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: search-index-diff
          path: ${{ runner.temp }}/out

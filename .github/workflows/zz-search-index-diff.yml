# TEMPORARY experiment, not for merge. Finds out why the production search
# index hashes differently in two CI builds of the same fixture content
# (see the mask in tests/change-highlights.spec.ts).
#
# Builds the OSS fixture three times, the way `make test-oss` does on CI:
#   a1, a2  plain production builds (hugo-oss.toml), run back to back
#   b       the change-highlights production build (build-changes)
# then diffs the three search indexes. a1 vs a2 shows run-to-run variation;
# a1 vs b shows what the change-highlights switch adds.
name: Search index diff (experiment)

on:
  push:
    branches: [kkb-search-index-diff]

permissions:
  contents: read

env:
  HUGO_VERSION: 0.160.1
  NODE_VERSION: '20'

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Set up Go (Hugo modules use go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.21'

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Build a1, a2 (plain) and b (change highlights)
        run: |
          set -euo pipefail
          hugo --config hugo-oss.toml --gc -d "$RUNNER_TEMP/a1"
          hugo --config hugo-oss.toml --gc -d "$RUNNER_TEMP/a2"
          HUGO_PARAMS_THEMEEXTRAS_CHANGEHIGHLIGHTS=true hugo --config hugo-oss.toml,hugo-oss-changes.toml --gc -d "$RUNNER_TEMP/b"

      - name: Diff the search indexes
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          for v in a1 a2 b; do
            f=$(find "$RUNNER_TEMP/$v" -name 'en.search-data.min.*.json' | head -1)
            echo "$v: $(basename "$f")"
            jq -S . "$f" > "$out/$v.json"
            jq -r 'to_entries[] | "\(.key)\t\(.value | tostring | length)"' "$f" | sort > "$out/$v.keys.tsv"
          done
          for pair in "a1 a2" "a1 b"; do
            set -- $pair
            echo "::group::$1 vs $2"
            if cmp -s "$out/$1.json" "$out/$2.json"; then
              echo "IDENTICAL"
            else
              echo "Pages whose entry differs (key, length in $1, length in $2):"
              join -t $'\t' -a1 -a2 -e MISSING -o 0,1.2,2.2 "$out/$1.keys.tsv" "$out/$2.keys.tsv" | awk -F'\t' '$2!=$3' | head -50
              diff -u "$out/$1.json" "$out/$2.json" > "$out/$1-vs-$2.diff"
              echo "--- first 200 lines of the diff:"
              head -200 "$out/$1-vs-$2.diff"
            fi
            echo "::endgroup::"
          done

      - name: Upload indexes and diffs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: search-index-diff
          path: ${{ runner.temp }}/out
